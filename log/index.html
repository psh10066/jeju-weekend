  main.querySelector('.actions').innerHTML = '<button class="pill" type="button" id="logout" hidden>로그아웃</button>';
  main.querySelector('.mast').insertAdjacentHTML('afterend', `<section class="famlog" aria-label="가족 기록">
    <div class="sum" id="sum"></div><div class="fam" id="fam"></div>
    <div class="lg-tabs" id="tabs" role="group" aria-label="보기" hidden><button type="button" data-tab="feed">피드</button><button type="button" data-tab="plan">계획표</button></div>
    <div class="lg-login" id="auth" hidden><form id="authForm">
      <p>가족만 기록할 수 있어요. 처음이면 ‘가입’을 눌러주세요.</p>
      <label class="lg-field" for="email">이메일</label><input class="lg-input" id="email" type="email" autocomplete="email" required>
      <label class="lg-field" for="pw">비밀번호 (6자 이상)</label><input class="lg-input" id="pw" type="password" minlength="6" autocomplete="current-password" required>
      <div id="roleBox" hidden><label class="lg-field" for="role">역할</label><select class="lg-input" id="role"></select></div>
      <p class="lg-err" id="authErr"></p>
      <div class="lg-btns"><button class="lg-b" id="authBtn">로그인</button><button type="button" class="lg-b ghost" id="modeBtn">처음이에요 · 가입</button></div>
    </form></div></section>
    <section id="feed" aria-label="가족 피드"></section>`);
  main.querySelector('.mobile-nav').insertAdjacentHTML('beforeend', '<a href="#extra" class="lg-nav">+ 계획 밖</a>');

  // 계획 장소마다 기록 줄(.logrow)을 그 장소 설명 끝에 단다. 한 칸에 장소가 여럿이면 이름을 붙여 한 줄씩
  main.querySelectorAll('section.day').forEach(sec => {
    const day = sec.querySelector('.en')?.textContent.trim() + ' · ' + sec.querySelector('h2')?.textContent.trim();
    const addRows = (links, put) => links.forEach(a => {
      const name = a.textContent.replace(/[↗\s]+$/, '').replace(/\s+/g, ' ').trim();
      if (!plan.some(p => p.url === a.href)) plan.push({ day, name, url: a.href });
      put(`<div class="logrow" data-plan="${esc(a.href)}" data-name="${esc(name)}" data-labeled="${links.length > 1 ? 1 : ''}"></div>`);
    });
    sec.querySelectorAll('.stop .detail').forEach(d => {
      const opt = d.querySelector('.option');
      const own = [...d.querySelectorAll(':scope > h3 a.place, :scope > .choice a')];
      addRows(own, html => opt ? opt.insertAdjacentHTML('beforebegin', html) : d.insertAdjacentHTML('beforeend', html));
      d.querySelectorAll('.option').forEach(o => addRows([...o.querySelectorAll(':scope > h3 a.place')], html => o.insertAdjacentHTML('beforeend', html)));
    });
    // 칸마다 key(요일|제목)를 달고, 그 칸 다음에 다른 장소를 끼워 넣는 버튼
    const short = { sat: '토', sun: '일', mon: '월' }[sec.id] ?? '';
    sec.querySelectorAll('.stop').forEach(st => {
      const title = st.querySelector('.detail h3')?.textContent.replace(/\s+/g, ' ').trim() ?? '';
      st.dataset.key = `${sec.id}|${title}`;
      stops.push({ key: st.dataset.key, day, label: `${short} ${st.querySelector('.time')?.firstChild?.textContent.trim() ?? ''} ${title}` });
      st.querySelector('.detail').insertAdjacentHTML('beforeend', `<button type="button" class="lg-here" data-here="${esc(st.dataset.key)}" hidden>＋ 이 다음에 다른 곳 추가</button>`);
    });
  });

  main.querySelector('.days').insertAdjacentHTML('beforeend', `<section class="day extra" id="extra"><header class="day-head"><span class="day-no">+</span><div><h2>계획 밖 장소</h2><p>자리를 정하지 않은 곳은 여기에 모여요</p></div><span class="en">EXTRA</span></header>
    <div class="timeline" id="extraList"></div><button type="button" class="lg-go" data-new-place="1">+ 다른 곳 추가</button></section>`);
  main.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  main.querySelectorAll('[data-check]').forEach(input => { // 계획표의 체크리스트 저장 그대로
    const key = 'jeju-trip-' + input.dataset.check;
    try { input.checked = localStorage.getItem(key) === 'yes'; } catch {}
    input.addEventListener('change', () => { try { localStorage.setItem(key, input.checked ? 'yes' : 'no'); } catch {} });
  });

  const groups = [...new Set(plan.map(p => p.day))];
  $('#sPos').innerHTML = '<option value="">맨 끝 ‘계획 밖’ 칸</option>' + [...new Set(stops.map(s => s.day))].map(g =>
    `<optgroup label="${esc(g)}">${stops.filter(s => s.day === g).map(s => `<option value="${esc(s.key)}">${esc(s.label)} 다음</option>`).join('')}</optgroup>`).join('');
  $('#sPlace').innerHTML = '<option value="">장소 없이 쓰기</option>' +
    groups.map(g => `<optgroup label="${esc(g)}">${plan.filter(p => p.day === g).map(p => `<option value="${esc(p.url)}">${esc(p.name)}</option>`).join('')}</optgroup>`).join('') +
    '<optgroup label="계획 밖 · 추가된 곳" id="sExtraOpts"></optgroup>';

  $('#modeBtn').onclick = () => { $('#authBtn').disabled = false; setMode(!signup); };
  $('#authForm').onsubmit = onAuth;
  $('#logout').onclick = () => sb.auth.signOut();
  $('#tabs').onclick = e => { if (e.target.dataset.tab) setTab(e.target.dataset.tab); };
  sb.auth.onAuthStateChange(onSession);
}

function setTab(t) {
  tab = t;
  try { localStorage.setItem('jeju-log-tab', t); } catch {}
  document.body.classList.toggle('feed', !!me && t === 'feed');
  $('#tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === t));
}

// ---------- 로그인 / 가입 ----------
async function setMode(isSignup) {
  signup = isSignup;
  $('#authBtn').textContent = signup ? '가입' : '로그인';
  $('#modeBtn').textContent = signup ? '이미 가입했어요' : '처음이에요 · 가입';
  $('#roleBox').hidden = !signup;
  $('#authErr').textContent = '';
  if (!signup) return;
  const { data } = await sb.rpc('open_roles');
  $('#role').innerHTML = (data || []).map(r => `<option>${r}</option>`).join('');
  if (!data?.length) { $('#authErr').textContent = '가족 4명이 모두 가입했어요. 관리자에게 문의하세요.'; $('#authBtn').disabled = true; }
}
async function onAuth(e) {
  e.preventDefault();
  $('#authBtn').disabled = true;
  const email = $('#email').value.trim(), password = $('#pw').value;
  const { error } = signup
    ? await sb.auth.signUp({ email, password, options: { data: { role: $('#role').value } } })
    : await sb.auth.signInWithPassword({ email, password });
  $('#authBtn').disabled = false;
  $('#authErr').textContent = error ? (error.message.includes('Invalid login') ? '이메일이나 비밀번호가 맞지 않아요' : error.message) : '';
}
function onSession(_ev, session) {
  const user = session?.user ?? null;
  if (me !== undefined && user?.id === me?.id) return; // 토큰 갱신 등 같은 사용자 이벤트는 무시
  me = user;
  $('#auth').hidden = !!me; $('#logout').hidden = !me; $('#tabs').hidden = !me; $('#fab').hidden = !me;
  setTab(tab);
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!me) { members = visits = reviews = comments = likes = []; render(); return setMode(false); }
  load();
  // shortcut: 변경이 오면 전체를 다시 읽음 (가족 4명 규모라 충분), 데이터가 커지면 행 단위 반영으로
  let t; const reload = () => { clearTimeout(t); t = setTimeout(load, 300); };
  channel = sb.channel('family');
  ['visits', 'reviews', 'members', 'comments', 'likes'].forEach(table => channel.on('postgres_changes', { event: '*', schema: 'public', table }, reload));
  channel.subscribe();
}

// ---------- 데이터 ----------
async function load() {
  const [m, v, r, c, l] = await Promise.all([
    sb.from('members').select('*').order('created_at'),
    sb.from('visits').select('*').order('visited_at').order('created_at'),
    sb.from('reviews').select('*').order('created_at', { ascending: false }),
    sb.from('comments').select('*').order('created_at'),
    sb.from('likes').select('*').order('created_at'),
  ]);
  members = m.data || []; visits = v.data || []; reviews = r.data || []; comments = c.data || []; likes = l.data || [];
  if (me && !members.some(x => x.user_id === me.id)) {
    alert('가족 명단에 없는 계정이에요. 다시 로그인해 주세요.');
    return sb.auth.signOut();
  }
  const paths = reviews.flatMap(x => x.photo_paths).filter(p => !photos[p]);
  if (paths.length) {
    const { data } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
    (data || []).forEach(d => { if (d.signedUrl) photos[d.path] = d.signedUrl; });
  }
  render();
}

const who = id => members.find(x => x.user_id === id);
const roleOf = id => who(id)?.role ?? '탈퇴한 가족';
const isAdmin = () => me?.email === ADMIN;
const mine = row => row.user_id === me?.id || isAdmin();
const myReview = v => v && reviews.find(r => r.visit_id === v.id && r.user_id === me?.id); // 장소 리뷰는 사람당 1개
// 긴 글은 N줄까지만 보이고 '더 보기'로 펼친다 (숨은 탭에선 높이를 못 재서 줄 수·길이로 판단)
const longText = (body, lines, prefix = '') => `<div class="clamp" style="--lines:${lines}">${prefix}${esc(body)}</div>${
  body.split('\n').length > lines || body.length > lines * 38 ? '<button type="button" class="more" data-more="1">더 보기</button>' : ''}`;
const hm = ts => new Date(ts).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
const ymd = ts => new Date(new Date(ts).getTime() + 9 * 3600e3).toISOString().slice(0, 10); // KST 날짜
const hasPosts = v => reviews.some(r => r.visit_id === v.id);
// 글 없는 방문 기록은 가족 누구나 취소/삭제, 글이 달린 건 관리자만 (DB 정책과 같음)
const canDelete = v => v && (isAdmin() || !hasPosts(v));
const delLabel = v => hasPosts(v) ? (v.plan_ref ? '이 방문 기록과 글 모두 지우기' : '이 장소와 글 모두 지우기') : '다녀왔어요 취소';
const cancelBtn = v => hasPosts(v) ? '' : `<button type="button" class="lg-x" data-cancel-visit="${v.id}">다녀왔어요 취소</button>`;
const ga = w => (w.charCodeAt(w.length - 1) - 0xAC00) % 28 ? w + '이' : w + '가'; // 아들이 · 엄마가
const stars = n => n ? `<span class="st">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : '';

const counts = r => { // 계획표 탭에선 좋아요·댓글 수만
  const l = likes.filter(x => x.review_id === r.id).length, c = comments.filter(x => x.review_id === r.id).length;
  return `${l ? ` <span class="t">♥${l}</span>` : ''}${c ? ` <span class="t">💬${c}</span>` : ''}`;
};
function reviewsHtml(visit) { // 계획표 탭: 장소 아래 짧게
  return reviews.filter(r => r.visit_id === visit.id).reverse().map(r => `<div class="rv">${av(roleOf(r.user_id), 'sm')}
    <div><b>${esc(roleOf(r.user_id))}</b> ${stars(r.rating)}${counts(r)}${r.user_id === me?.id ? ` <button class="lg-x" data-edit-review="${r.id}">수정</button>` : ''}${mine(r) ? `<button class="lg-x" data-del-review="${r.id}">지우기</button>` : ''}${r.body ? longText(r.body, 3) : ''}
    ${r.photo_paths.length ? `<div class="thumbs">${r.photo_paths.slice(0, 4).map(p => !photos[p] ? '' : isVideo(p)
      ? `<video src="${esc(photos[p])}#t=0.1" muted playsinline preload="metadata"></video>` : `<img src="${esc(photos[p])}" alt="" loading="lazy">`).join('')}</div>` : ''}</div></div>`).join('');
}

function postHtml(r) { // 피드 탭: 인스타 카드
  const v = r.visit_id ? visits.find(x => x.id === r.visit_id) : null;
  const imgs = r.photo_paths.filter(p => photos[p]);
  return `<article class="post">
    <div class="post-h">${av(roleOf(r.user_id))}<div><div class="n">${esc(roleOf(r.user_id))} <span class="t">· ${when(r.created_at)}</span></div>
      ${v ? `<button type="button" class="pl" data-goto="${v.id}">📍 ${esc(v.place_name)}</button>` : ''}</div>
      <span style="margin-left:auto">${r.user_id === me?.id ? `<button class="lg-x" data-edit-review="${r.id}">수정</button>` : ''}${mine(r) ? `<button class="lg-x" data-del-review="${r.id}">지우기</button>` : ''}</span></div>
    ${imgs.length ? `<div class="post-imgs"><div class="track" data-track="${r.id}">${imgs.map((p, i) => isVideo(p)
      ? `<video src="${esc(photos[p])}#t=0.1" controls playsinline preload="metadata"></video>`
      : `<img src="${esc(photos[p])}" alt="${esc(roleOf(r.user_id))}의 사진 ${i + 1}" loading="lazy">`).join('')}</div>${imgs.length > 1 ? `<span class="cnt">1/${imgs.length}</span>` : ''}</div>` : ''}
    ${r.rating || r.body ? `<div class="post-b">${stars(r.rating)}${r.body ? longText(r.body, 5, `<b>${esc(roleOf(r.user_id))}</b>`) : ''}</div>` : ''}
    ${socialHtml(r)}
  </article>`;
}

function socialHtml(r) { // 좋아요(누가·언제) · 댓글(누가·언제, 본인 수정/지우기, 관리자 지우기)
  const ls = likes.filter(x => x.review_id === r.id), cs = comments.filter(x => x.review_id === r.id);
  const liked = ls.some(x => x.user_id === me?.id);
  const SHOW = 2, hidden = cs.length > SHOW && !openComments.has(r.id);
  return `<div class="social">
    <div class="acts"><button type="button" class="like${liked ? ' on' : ''}" data-like="${r.id}" aria-pressed="${liked}" aria-label="좋아요"><i class="ic ic-heart"></i></button>
      <label class="cmt-ico" for="c${r.id}" aria-label="댓글 달기"><i class="ic ic-chat"></i></label>
      ${r.photo_paths.length ? `<button type="button" class="save" data-save="${r.id}" aria-label="사진·동영상 저장"><i class="ic ic-down"></i>${r.photo_paths.length > 1 ? `${r.photo_paths.length}개 저장` : '저장'}</button>` : ''}</div>
    ${ls.length ? `<details class="likers"><summary>${ls.map(x => esc(roleOf(x.user_id))).join(', ')}님이 좋아해요</summary>
      <ul>${ls.map(x => `<li>${av(roleOf(x.user_id), 'sm')} ${esc(roleOf(x.user_id))} <span class="t">${when(x.created_at)}</span></li>`).join('')}</ul></details>` : ''}
    ${hidden ? `<button type="button" class="more" data-all-comments="${r.id}">댓글 ${cs.length}개 모두 보기</button>` : ''}
    ${(hidden ? cs.slice(-SHOW) : cs).map(x => x.id === editingComment ? `<form class="cmt cmt-edit" data-cid="${x.id}">${av(roleOf(x.user_id), 'sm')}<div class="cb" style="flex:1">
      <textarea id="ce${x.id}" class="lg-input" maxlength="1000" rows="2">${esc(x.body)}</textarea>
      <div class="lg-btns" style="margin-top:6px"><button type="button" class="lg-b ghost" data-cancel-edit="1">취소</button><button class="lg-b">저장</button></div></div></form>` : `<div class="cmt">${av(roleOf(x.user_id), 'sm')}<div class="cb"><b>${esc(roleOf(x.user_id))}</b> <span class="ct">${esc(x.body)}</span><div class="t">${when(x.created_at)}${x.user_id === me?.id ? ` · <button class="lg-x" data-edit-comment="${x.id}">수정</button>` : ''}${
        x.user_id === me?.id || isAdmin() ? `<button class="lg-x" data-del-comment="${x.id}">지우기</button>` : ''}</div></div></div>`).join('')}
    <form class="cmt-form" data-comment="${r.id}"><input id="c${r.id}" class="lg-input" maxlength="1000" placeholder="댓글 달기…" autocomplete="off" enterkeyhint="send"><button class="lg-b ghost">게시</button></form>
  </div>`;
}

function render() {
  const planDone = plan.filter(p => visits.some(v => v.plan_ref === p.url)).length;
  const extra = visits.filter(v => !v.plan_ref), extraDone = extra.filter(v => v.visited_at).length;
  $('#sum').innerHTML = me
    ? `계획 ${plan.length}곳 중 ${planDone}곳 다녀옴 <span>· 계획 밖 ${extraDone}곳 · 글 ${reviews.length}개</span>`
    : '<span>로그인하면 가족이 남긴 기록이 이 계획표 위에 함께 보여요.</span>';
  $('#fam').innerHTML = members.map(m => `<div class="p">${av(m.role, 'big')}<b>${esc(m.role)}${m.user_id === me?.id ? ' (나)' : ''}</b><small>${esc(m.email)}</small>${
    m.email === ADMIN ? '<small>관리자</small>' : ''}${isAdmin() && m.user_id !== me.id ? `<button class="lg-x" data-reset-pw="${m.user_id}">비밀번호 초기화</button><button class="lg-x" data-remove="${m.user_id}">탈퇴시키기</button>` : ''}${
    m.user_id === me?.id ? '<button class="lg-x" data-my-pw="1">비밀번호 바꾸기</button><button class="lg-x" data-logout="1">로그아웃</button>' : ''}</div>`).join('');

  document.querySelectorAll('.logrow').forEach(row => {
    if (!me) { row.innerHTML = ''; return; }
    const v = visits.find(x => x.plan_ref === row.dataset.plan);
    const label = row.dataset.labeled ? `${esc(row.dataset.name)} ` : '';
    row.innerHTML = v
      ? `<button type="button" class="lg-go done" data-open="${esc(row.dataset.plan)}">✓ ${label}${when(v.visited_at)} 다녀옴 · ${myReview(v) ? '내 리뷰 수정' : '리뷰 쓰기'}</button>${cancelBtn(v)}${reviewsHtml(v)}`
      : `<button type="button" class="lg-go" data-open="${esc(row.dataset.plan)}">${label}다녀왔어요</button>`;
  });

  $('#extra').hidden = !me;
  $('#sExtraOpts').innerHTML = extra.map(v => `<option value="v:${v.id}">${esc(v.place_name)}</option>`).join('');
  // 계획 밖 장소: 자리를 정한 곳은 그 칸 다음에 끼우고(같은 자리는 추가한 순서대로), 나머지는 맨 끝 칸에
  document.querySelectorAll('.lg-added').forEach(el => el.remove());
  document.querySelectorAll('.lg-here').forEach(b => { b.hidden = !me; });
  const card = (v, added) => `<article class="stop${added ? ' lg-added' : ''}" data-visit-row="${v.id}"><div class="time">${v.visited_at ? hm(v.visited_at) : ''}<small>${added || !v.visited_at ? '추가' : md(ymd(v.visited_at))} · ${esc(roleOf(v.user_id))}</small></div><div class="detail">
    <h3>${v.place_url ? `<a class="place" href="${esc(v.place_url)}" target="_blank" rel="noopener noreferrer">${esc(v.place_name)}</a>` : esc(v.place_name)}${added ? ' <span class="tag">계획에 없던 곳</span>' : ''}</h3>
    ${v.note ? `<p>${esc(v.note)}</p>` : ''}${v.address ? `<p class="address">${esc(v.address)}</p>` : ''}
    ${v.visited_at ? `<button type="button" class="lg-go done" data-open-visit="${v.id}">✓ ${when(v.visited_at)} 다녀옴 · ${myReview(v) ? '내 리뷰 수정' : '리뷰 쓰기'}</button>${cancelBtn(v)}`
      : `<button type="button" class="lg-go" data-open-visit="${v.id}">다녀왔어요</button>`}${hasPosts(v) ? '' : `<button type="button" class="lg-x" data-del-visit="${v.id}">장소 삭제</button>`}${reviewsHtml(v)}</div></article>`;
  const loose = extra.filter(v => {
    const anchor = v.after_ref && [...document.querySelectorAll('.stop[data-key]')].find(s => s.dataset.key === v.after_ref);
    if (!anchor) return true; // 자리를 안 정했거나 계획표가 바뀌어 그 칸이 사라진 경우
    let ref = anchor;
    while (ref.nextElementSibling?.classList.contains('lg-added')) ref = ref.nextElementSibling;
    ref.insertAdjacentHTML('afterend', card(v, true));
    return false;
  });
  $('#extraList').innerHTML = loose.length ? loose.map(v => card(v, false)).join('')
    : '<p class="extra-empty">계획에 없던 곳을 갔다면 원하는 칸의 ‘＋ 이 다음에 다른 곳 추가’를 누르거나 여기서 추가하세요.</p>';

  // 피드: 글 + (글 없이) 다녀왔어요만 누른 기록을 시간순으로
  const items = [
    ...reviews.map(r => ({ at: r.created_at, html: postHtml(r) })),
    ...visits.filter(v => v.visited_at && !hasPosts(v)).map(v => ({ at: v.created_at,
      html: `<p class="visit-line">${av(roleOf(v.user_id), 'sm')}<span><b>${esc(ga(roleOf(v.user_id)))}</b> <button type="button" class="pl" data-goto="${v.id}">📍 ${esc(v.place_name)}</button>에 다녀왔어요 · ${when(v.visited_at)} ${cancelBtn(v)}</span></p>` })),
  ].sort((a, b) => b.at.localeCompare(a.at));
  const typing = Object.fromEntries([...document.querySelectorAll('.cmt-form input, .cmt-edit textarea')].map(i => [i.id, i.value]));
  const focused = document.activeElement?.closest?.('.cmt-form, .cmt-edit') ? document.activeElement.id : null;
  const at = Object.fromEntries([...document.querySelectorAll('[data-track]')].map(t => [t.dataset.track, t.scrollLeft])); // 넘겨 보던 사진 자리 유지
  $('#feed').innerHTML = items.length ? items.map(x => x.html).join('') : '<p class="feed-empty">아직 올라온 글이 없어요.<br>오른쪽 아래 ＋ 버튼으로 첫 글을 올려보세요.</p>';
  Object.entries(typing).forEach(([id, val]) => { const i = document.getElementById(id); if (i) i.value = val; }); // 실시간 갱신에 쓰던 댓글이 날아가지 않게
  if (focused) document.getElementById(focused)?.focus();
  document.querySelectorAll('[data-track]').forEach(t => { if (at[t.dataset.track]) t.scrollLeft = at[t.dataset.track]; });
}

// ---------- 작성 시트 ----------
// cur = { planUrl, visit, name } · 피드의 ＋는 장소를 고를 수 있고, 장소에서 열면 그 장소로 고정
function openSheet({ planUrl = null, visitId = null, newPlace = false, after = null, editId = null } = {}) {
  if (editId) return openEdit(reviews.find(r => r.id === +editId));
  $('#sPhotoBox').hidden = false;
  const visit = visitId ? visits.find(v => v.id === +visitId) : planUrl ? visits.find(v => v.plan_ref === planUrl) : null;
  if (myReview(visit)) return openEdit(myReview(visit));
  const fixed = !!(planUrl || visit);
  cur = { planUrl, visit, newPlace, media: [], name: visit?.place_name ?? plan.find(x => x.url === planUrl)?.name };
  $('#sheetForm').reset(); paintStars(); $('#sBody').style.height = '';
  paintMedia();
  $('#sTitle').textContent = fixed ? cur.name : newPlace ? '계획 밖 장소 추가' : '새 글';
  $('#sMeta').textContent = visit?.visited_at ? `${when(visit.visited_at)} 다녀옴 · ${ga(roleOf(visit.user_id))} 처음 기록` : fixed ? '글 없이 올려도 ‘다녀옴’으로 표시돼요' : '';
  $('#sPlaceBox').hidden = fixed || newPlace;
  $('#sPlace').value = '';
  $('#sNew').hidden = !newPlace;
  $('#sStarBox').hidden = !fixed;
  $('#sBodyBox').hidden = $('#sPhotoBox').hidden = newPlace; // 장소 추가는 장소만, 다녀왔어요·리뷰는 그 다음에
  showDel(visit);
  showWhen(visit, fixed);
  showPos(visit, newPlace, after);
  $('#sNoteBox').hidden = !(newPlace || cur.move); // 추가한 장소의 코멘트는 추가한 사람이 쓰고 고친다
  $('#sNote').value = cur.move?.note ?? '';
  if (after) $('#sMeta').textContent = `${stops.find(s => s.key === after)?.label ?? ''} 다음에 들어가요`;
  $('#sSave').textContent = newPlace ? '장소 추가' : fixed && !visit?.visited_at ? '다녀왔어요 · 올리기' : '올리기';
  $('#sErr').textContent = ''; $('#sSave').disabled = false;
  $('#sheet').showModal();
}
function openEdit(r) { // 본인 글 수정: 글·별점·사진(빼기·더하기)
  const v = r.visit_id ? visits.find(x => x.id === r.visit_id) : null;
  cur = { edit: r, media: [...r.photo_paths] };
  $('#sheetForm').reset();
  paintMedia();
  $('#sTitle').textContent = v ? `내 리뷰 수정` : '글 수정';
  $('#sMeta').textContent = v ? `📍 ${v.place_name}` : '';
  $('#sPlaceBox').hidden = $('#sNew').hidden = $('#sDelBox').hidden = true;
  $('#sBodyBox').hidden = $('#sPhotoBox').hidden = false;
  $('#sStarBox').hidden = !v;
  showWhen(v, false);
  showPos(v, false);
  $('#sNoteBox').hidden = true;
  if (r.rating) $(`#st${r.rating}`).checked = true;
  paintStars();
  $('#sBody').value = r.body ?? '';
  requestAnimationFrame(grow);
  $('#sSave').textContent = '수정 완료'; $('#sErr').textContent = ''; $('#sSave').disabled = false;
  $('#sheet').showModal();
}
// 방문 시각: 새로 기록할 땐 지금(30분 단위 내림), 이미 누가 기록한 곳은 그 시각. 바꿀 수 있는 건 기록한 사람·관리자
function showWhen(visit, creating) {
  cur.whenEditable = visit?.visited_at ? mine(visit) : creating;
  $('#sWhenBox').hidden = !cur.whenEditable;
  const ts = visit?.visited_at ?? Date.now() - Date.now() % 1800e3;
  $('#sDay').value = ymd(ts);
  const [h, m] = hm(ts).split(':').map(Number);
  $('#sTime').value = `${String(h).padStart(2, '0')}:${m < 30 ? '00' : '30'}`;
  cur.whenOrig = $('#sDay').value + $('#sTime').value;
}
const whenISO = () => new Date(`${$('#sDay').value}T${$('#sTime').value}:00+09:00`).toISOString();
function showDel(visit) {
  $('#sDelBox').hidden = !visit?.visited_at || !canDelete(visit);
  if (visit) $('#sDel').textContent = delLabel(visit);
}
function showPos(visit, newPlace, after = null) { // 새 장소는 자리 고르기, 내가 추가한 장소는 자리 옮기기
  cur.move = visit && !visit.plan_ref && mine(visit) ? visit : null;
  $('#sPosBox').hidden = !(newPlace || cur.move);
  $('#sPos').value = cur.move ? cur.move.after_ref ?? '' : after ?? '';
}
$('#sPos').onchange = async () => {
  if (!cur.move) return; // 새 장소는 저장할 때 같이 들어감
  const { error } = await sb.from('visits').update({ after_ref: $('#sPos').value || null }).eq('id', cur.move.id);
  $('#sErr').textContent = error ? error.message : '';
  if (!error) { $('#sMeta').textContent = '계획표에서 자리를 옮겼어요'; load(); }
};
$('#sPlace').onchange = e => {
  const v = e.target.value;
  const ex = v.startsWith('v:') ? visits.find(x => x.id === +v.slice(2)) : null; // 계획 밖으로 추가된 곳
  cur.planUrl = v && v !== 'new' && !ex ? v : null;
  cur.name = ex?.place_name ?? plan.find(x => x.url === cur.planUrl)?.name;
  cur.visit = ex ?? (cur.planUrl ? visits.find(x => x.plan_ref === cur.planUrl) : null);
  if (myReview(cur.visit)) { $('#sheet').close(); return openEdit(myReview(cur.visit)); } // 이미 리뷰한 곳은 수정으로
  $('#sStarBox').hidden = !v;
  showWhen(cur.visit, !!v);
  showDel(cur.visit);
};
// 올릴 사진·동영상: 이미 올라간 건 경로(문자열), 새로 고른 건 File. 이 순서대로 저장되고 첫 장이 피드 대표
const blobUrl = new WeakMap(), src = x => typeof x === 'string' ? photos[x] ?? ''
  : blobUrl.get(x) ?? (blobUrl.set(x, URL.createObjectURL(x)), blobUrl.get(x));
function paintMedia() {
  $('#sPreviews').innerHTML = cur.media.map((x, i) => `<span class="keep">${(typeof x === 'string' ? isVideo(x) : isVideoFile(x))
    ? `<video src="${esc(src(x))}#t=0.1" muted playsinline preload="metadata"></video>` : `<img src="${esc(src(x))}" alt="">`}<button type="button" data-unkeep="${i}" aria-label="빼기">✕</button>${
    i ? `<button type="button" class="left" data-left="${i}" aria-label="앞으로 옮기기">◀</button>` : ''}${
    i < cur.media.length - 1 ? `<button type="button" class="right" data-left="${i + 1}" aria-label="뒤로 옮기기">▶</button>` : ''}</span>`).join('');
}
$('#sPreviews').onclick = e => {
  const { unkeep, left } = e.target.dataset, m = cur.media;
  if (unkeep) m.splice(+unkeep, 1);
  else if (left) { const i = +left; [m[i - 1], m[i]] = [m[i], m[i - 1]]; }
  else return;
  paintMedia();
};
$('#sPhoto').onchange = e => { // 고를 때마다 뒤에 더한다 (여러 번 나눠 골라도 됨)
  const files = [...e.target.files], big = files.filter(f => isVideoFile(f) && f.size > 50 * 1024 * 1024);
  const ok = files.filter(f => !big.includes(f)), room = 10 - cur.media.length;
  cur.media.push(...ok.slice(0, room));
  $('#sErr').textContent = big.length ? `‘${big[0].name}’은 50MB가 넘어서 뺐어요. 짧게 잘라서 올려주세요.`
    : ok.length > room ? `모두 10개까지라 ${ok.length - room}개는 빠졌어요` : '';
  e.target.value = '';
  paintMedia();
};
$('#sClose').onclick = () => $('#sheet').close();
const grow = () => { const b = $('#sBody'); b.style.height = 'auto'; b.style.height = b.scrollHeight + 2 + 'px'; };
$('#sBody').addEventListener('input', grow);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.target.close(); }); // 바깥 누르면 닫기

// 네이버 지도 앱 '공유 → 복사' 본문: [네이버지도] / 이름 / 주소 / 링크. 링크만 넣어도 된다
function parseShare(text) {
  const url = text.match(/https?:\/\/\S+/)?.[0] ?? '';
  const [name = '', address = ''] = text.split('\n').map(s => s.trim()).filter(s => s && !/^\[.*\]$/.test(s) && !/^https?:\/\//.test(s));
  return { url, name, address };
}
const trimName = (addr, name) => addr && name && addr.endsWith(' ' + name) ? addr.slice(0, -name.length - 1) : addr; // 주소 끝에 붙는 상호 떼기
$('#sLink').addEventListener('paste', () => setTimeout(() => $('#sResolve').click())); // 붙여넣으면 바로 불러오기

$('#sResolve').onclick = async () => {
  const share = parseShare($('#sLink').value);
  if (!share.url && !share.name) return;
  $('#sErr').textContent = '';
  if (share.name) $('#sName').value = share.name; // 링크 해석이 실패해도 붙여넣은 내용으로 저장되게 먼저 채운다
  if (share.address) $('#sAddr').value = trimName(share.address, share.name);
  $('#sLink').value = share.url;
  if (!share.url) return;
  $('#sResolve').disabled = true;
  const opened = cur; // 응답이 오기 전에 창을 닫고 다른 걸 열었으면 결과를 버린다
  const { data, error } = await sb.functions.invoke('resolve-place', { body: { url: share.url } }).catch(error => ({ error }));
  $('#sResolve').disabled = false;
  if (cur !== opened || !$('#sheet').open) return;
  if (error) {
    if (share.name) { $('#sMeta').textContent = '붙여넣은 이름·주소·링크로 저장돼요'; return; }
    let msg = '불러오지 못했어요. 이름을 직접 입력해 주세요.';
    try { msg = (await error.context.json()).error || msg; } catch {}
    $('#sErr').textContent = msg; return;
  }
  $('#sLink').value = data.url;
  if (data.name) $('#sName').value = data.name; else if (!share.name) $('#sErr').textContent = '이름을 못 가져왔어요. 직접 입력해 주세요.';
  if (data.address) $('#sAddr').value = trimName(data.address, data.name || share.name);
  const p = plan.find(x => x.url === data.url || x.name === data.name);
  if (visits.some(x => x.place_url === data.url)) $('#sErr').textContent = '이미 추가된 곳이에요. 계획표에서 그 장소의 ‘다녀왔어요’를 눌러주세요';
  else if (p) $('#sErr').textContent = `계획표에 이미 있는 곳이에요 (${p.day})`;
};

const VIDEO_EXT = { 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' };
const isVideoFile = f => f.type.startsWith('video/');
const isVideo = p => /\.(mp4|mov|webm)$/i.test(p);
async function shrink(file) { // 짧은 변 1440px·긴 변 3200px 이하로만 줄인다 (폰 화면 폭의 실제 픽셀보다 크게, 무료 저장공간은 아끼게)
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1440 / Math.min(img.width, img.height), 3200 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}

async function uploadMedia(files) { // → 올라간 경로들
  if (files.some(f => isVideoFile(f) && f.size > 50 * 1024 * 1024)) throw new Error('50MB가 넘는 동영상은 올릴 수 없어요');
  const paths = files.map(f => `${me.id}/${crypto.randomUUID()}.${isVideoFile(f) ? VIDEO_EXT[f.type] ?? 'mp4' : 'jpg'}`);
  if (files.length) $('#sSave').textContent = '올리는 중…';
  await Promise.all(files.map(async (f, i) => {
    const up = isVideoFile(f)
      ? await sb.storage.from('photos').upload(paths[i], f, { contentType: VIDEO_EXT[f.type] ? f.type : 'video/mp4' })
      : await sb.storage.from('photos').upload(paths[i], await shrink(f), { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
  }));
  return paths;
}

async function ensureVisit() { // 장소가 정해졌으면 방문 기록(가족 공용 1건)을 찾거나 만든다
  if (cur.visit) return cur.visit;
  if (!cur.planUrl) return null;
  const same = visits.find(v => v.plan_ref === cur.planUrl);
  if (same) return same;
  const ins = await sb.from('visits').insert({ place_name: cur.name, place_url: cur.planUrl, plan_ref: cur.planUrl, user_id: me.id, visited_at: whenISO(), visited_on: $('#sDay').value }).select().single();
  if (ins.error?.code === '23505') return (await sb.from('visits').select().eq('plan_ref', cur.planUrl).single()).data; // 다른 가족이 방금 먼저 기록함
  if (ins.error) throw ins.error;
  return ins.data;
}

async function addPlace() { // 계획 밖 장소는 추가만 (다녀왔어요·리뷰는 계획표 장소처럼 따로)
  const row = { place_name: $('#sName').value.trim(), place_url: $('#sLink').value.trim() || null, address: $('#sAddr').value.trim() || null, note: $('#sNote').value.trim() || null, after_ref: $('#sPos').value || null };
  if (!row.place_name) throw new Error('장소 이름을 넣어주세요');
  if (row.place_url && !/^https:\/\//.test(row.place_url)) throw new Error('https:// 로 시작하는 링크만 넣을 수 있어요');
  if (row.place_url && (visits.some(v => v.place_url === row.place_url) || plan.some(p => p.url === row.place_url))) throw new Error('이미 계획표에 있는 곳이에요');
  const { error } = await sb.from('visits').insert({ ...row, user_id: me.id, visited_at: null });
  if (error) throw error.code === '23505' ? new Error('이미 계획표에 있는 곳이에요') : error;
}

$('#sheetForm').onsubmit = async e => {
  e.preventDefault();
  const label = $('#sSave').textContent;
  $('#sSave').disabled = true; $('#sErr').textContent = '';
  try {
    if (cur.newPlace) { await addPlace(); $('#sheet').close(); return load(); }
    if (!$('#sWhenBox').hidden && !$('#sDay').value) throw new Error('다녀온 날짜를 골라주세요');
    const marking = cur.visit && !cur.visit.visited_at; // 추가만 해둔 곳에 다녀왔어요
    const moved = cur.whenEditable && (cur.visit ?? cur.edit) && $('#sDay').value + $('#sTime').value !== cur.whenOrig;
    const target = cur.visit ?? (cur.edit?.visit_id && visits.find(x => x.id === cur.edit.visit_id));
    if ((moved || marking) && target) { // 이미 있는 방문 기록의 시각만 바꿈
      const { error } = await sb.from('visits').update({ visited_at: whenISO(), visited_on: $('#sDay').value }).eq('id', target.id);
      if (error) throw error;
    }
    const note = $('#sNote').value.trim() || null, noted = cur.move && !$('#sNoteBox').hidden && note !== (cur.move.note ?? null);
    if (noted) {
      const { error } = await sb.from('visits').update({ note }).eq('id', cur.move.id);
      if (error) throw error;
    }
    const body = $('#sBody').value.trim() || null, files = cur.media?.filter(x => x instanceof File) ?? [];
    const upload = async () => { const up = await uploadMedia(files); return { up, paths: cur.media.map(x => x instanceof File ? up[files.indexOf(x)] : x) }; };
    const rating = $('#sStarBox').hidden ? null : +($('#sStars input:checked')?.value || 0) || null;
    if (cur.edit) {
      if (!body && !rating && !cur.media.length) throw new Error('글을 비우려면 ‘지우기’를 눌러주세요');
      const { up, paths } = await upload();
      const { error } = await sb.from('reviews').update({ body, rating, photo_paths: paths }).eq('id', cur.edit.id);
      if (error) { if (up.length) await sb.storage.from('photos').remove(up); throw error; }
      const removed = cur.edit.photo_paths.filter(p => !paths.includes(p));
      if (removed.length) await sb.storage.from('photos').remove(removed);
      $('#sheet').close(); return load();
    }
    const hasPost = body || rating || files.length;
    if (!hasPost && (moved || marking || noted)) { $('#sheet').close(); return load(); }
    if (!hasPost && (cur.visit || $('#sPlace').value === '' && !cur.planUrl)) throw new Error('글이나 사진·동영상을 넣어주세요');
    const visit = await ensureVisit();
    if (hasPost && myReview(visit)) throw new Error('이미 이 장소에 리뷰를 남겼어요. ‘내 리뷰 수정’으로 고쳐주세요');
    if (hasPost) {
      const photo_paths = await uploadMedia(files);
      const { error } = await sb.from('reviews').insert({ visit_id: visit?.id ?? null, user_id: me.id, rating, body, photo_paths });
      if (error) {
        await sb.storage.from('photos').remove(photo_paths);
        throw error.code === '23505' ? new Error('이미 이 장소에 리뷰를 남겼어요. ‘내 리뷰 수정’으로 고쳐주세요') : error;
      }
    }
    $('#sheet').close();
    load();
  } catch (x) { $('#sErr').textContent = x.message; $('#sSave').disabled = false; $('#sSave').textContent = label; }
};

async function deleteVisit(v) {
  const msg = hasPosts(v) ? `‘${v.place_name}’ 방문 기록과 달린 글·사진·댓글을 모두 지울까요?`
    : v.plan_ref ? `‘${v.place_name}’ 다녀왔어요를 취소할까요?` : `추가한 장소 ‘${v.place_name}’를 삭제할까요?`;
  if (!confirm(msg)) return false;
  const paths = reviews.filter(r => r.visit_id === v.id).flatMap(r => r.photo_paths);
  if (paths.length) await sb.storage.from('photos').remove(paths);
  const { data, error } = await sb.from('visits').delete().eq('id', v.id).select();
  if (error || !data.length) { alert(error?.message ?? '지울 수 없어요. 그 사이 글이 달렸을 수 있어요.'); return false; }
  load(); return true;
}
async function unvisit(v) {
  if (v.plan_ref || hasPosts(v)) return deleteVisit(v);
  if (!confirm(`‘${v.place_name}’ 다녀왔어요를 취소할까요?`)) return false;
  const { data, error } = await sb.from('visits').update({ visited_at: null }).eq('id', v.id).select();
  if (error || !data.length) { alert(error?.message ?? '취소할 수 없어요. 그 사이 글이 달렸을 수 있어요.'); return false; }
  load(); return true;
}
$('#sDel').onclick = async () => { if (cur.visit && await unvisit(cur.visit)) $('#sheet').close(); };

// 사진·동영상 저장: 공유 창 없이 바로 파일로 내려받기 (안드로이드는 갤러리 'Download', 아이폰은 '파일' 앱 다운로드 폴더)
async function saveMedia(id, btn) {
  const r = reviews.find(x => x.id === +id);
  if (!r) return;
  const label = btn.innerHTML;
  btn.disabled = true; btn.lastChild.textContent = '받는 중…';
  try {
    for (const [i, p] of r.photo_paths.entries()) { // 한꺼번에 받으면 브라우저가 막아서 하나씩
      const blob = await (await fetch(photos[p])).blob();
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `제주-${roleOf(r.user_id)}-${r.id}-${i + 1}.${p.split('.').pop()}` });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
      await new Promise(res => setTimeout(res, 400));
    }
  } catch { alert('받지 못했어요. 새로고침 후 다시 눌러주세요.'); }
  btn.disabled = false; btn.innerHTML = label;
}

function gotoVisit(id) { // 피드의 📍 → 계획표 탭에서 그 장소로
  const v = visits.find(x => x.id === +id);
  if (!v) return;
  setTab('plan');
  const el = v.plan_ref ? [...document.querySelectorAll('.logrow')].find(r => r.dataset.plan === v.plan_ref) : document.querySelector(`[data-visit-row="${v.id}"]`);
  el?.closest('.stop')?.scrollIntoView({ block: 'center' });
}

$('#fab').onclick = () => openSheet();

// 작은 창: 내 비밀번호 바꾸기 · (관리자) 임시 비밀번호 보여주기
function mini(title, body, ok, onOk) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body; $('#mOk').textContent = ok; $('#mErr').textContent = '';
  $('#miniForm').onsubmit = async e => { e.preventDefault(); $('#mOk').disabled = true; try { await onOk(); } catch (x) { $('#mErr').textContent = x.message; } $('#mOk').disabled = false; };
  $('#mini').showModal();
}
$('#mClose').onclick = () => $('#mini').close();
function changeMyPassword() {
  mini('비밀번호 바꾸기', `<label class="lg-field" for="pw1">새 비밀번호 (6자 이상)</label><input class="lg-input" id="pw1" type="password" minlength="6" autocomplete="new-password" required>
    <label class="lg-field" for="pw2">한 번 더</label><input class="lg-input" id="pw2" type="password" minlength="6" autocomplete="new-password" required>`, '바꾸기', async () => {
    if ($('#pw1').value !== $('#pw2').value) throw new Error('두 비밀번호가 달라요');
    const { error } = await sb.auth.updateUser({ password: $('#pw1').value });
    if (error) throw new Error(/different from the old/.test(error.message) ? '지금 비밀번호와 다른 걸로 정해주세요' : error.message);
    $('#mBody').innerHTML = '<p>바꿨어요. 다음 로그인부터 새 비밀번호를 쓰세요.</p>'; $('#mOk').hidden = true;
  });
  $('#mOk').hidden = false;
}
async function resetPassword(id) {
  const m = who(id);
  if (!confirm(`${m.role}(${m.email}) 비밀번호를 임시 비밀번호로 바꿀까요? 그 사람의 기존 로그인은 모두 풀려요.`)) return;
  const { data, error } = await sb.rpc('reset_password', { target: id });
  if (error) return alert(error.message);
  mini(`${m.role} 임시 비밀번호`, `<p class="meta">${esc(m.email)}로 이 비밀번호를 써서 로그인한 뒤 ‘비밀번호 바꾸기’로 바꾸라고 전해주세요.</p>
    <input class="lg-input" id="tmpPw" readonly value="${esc(data)}" style="font-size:22px;letter-spacing:2px;text-align:center;margin-top:10px">`, '복사', async () => {
    await navigator.clipboard.writeText(data).catch(() => { $('#tmpPw').select(); document.execCommand('copy'); });
    $('#mOk').textContent = '복사했어요';
  });
  $('#mOk').hidden = false;
}
document.addEventListener('scroll', e => { // 사진 넘기면 1/4 → 2/4
  const t = e.target.closest?.('[data-track]'), cnt = t?.nextElementSibling;
  if (cnt) cnt.textContent = `${Math.round(t.scrollLeft / t.clientWidth) + 1}/${t.children.length}`;
}, true);
document.addEventListener('submit', async e => { // 댓글 수정 저장
  const f = e.target.closest('.cmt-edit');
  if (!f) return;
  e.preventDefault();
  const body = f.querySelector('textarea').value.trim();
  if (!body) return alert('댓글을 비우려면 ‘지우기’를 눌러주세요');
  const { error } = await sb.from('comments').update({ body }).eq('id', f.dataset.cid);
  if (error) return alert(error.message);
  editingComment = null; load();
});
document.addEventListener('submit', async e => { // 댓글 게시
  const f = e.target.closest('.cmt-form');
  if (!f) return;
  e.preventDefault();
  const input = f.querySelector('input'), body = input.value.trim();
  if (!body) return;
  f.querySelector('button').disabled = true;
  const { error } = await sb.from('comments').insert({ review_id: +f.dataset.comment, user_id: me.id, body });
  f.querySelector('button').disabled = false;
  if (error) return alert(error.message);
  input.value = ''; openComments.add(+f.dataset.comment); load();
});
document.addEventListener('click', async e => {
  const d = e.target.closest('button')?.dataset;
  if (!d) return;
  if (d.open) return openSheet({ planUrl: d.open });
  if (d.openVisit) return openSheet({ visitId: d.openVisit });
  if (d.newPlace) return openSheet({ newPlace: true });
  if (d.here) return openSheet({ newPlace: true, after: d.here });
  if (d.more) { e.target.previousElementSibling.classList.add('open'); return e.target.remove(); }
  if (d.goto) return gotoVisit(d.goto);
  if (d.myPw) return changeMyPassword();
  if (d.logout) return confirm('로그아웃할까요?') && sb.auth.signOut();
  if (d.resetPw) return resetPassword(d.resetPw);
  if (d.save) return saveMedia(d.save, e.target.closest('button'));
  if (d.cancelVisit) return unvisit(visits.find(x => x.id === +d.cancelVisit));
  if (d.delVisit) return deleteVisit(visits.find(x => x.id === +d.delVisit));
  if (d.editReview) return openSheet({ editId: d.editReview });
  if (d.like) {
    const btn = e.target.closest('button'); btn.classList.toggle('on'); btn.classList.add('pop'); // 누르자마자 반응
    const mineLike = likes.find(x => x.review_id === +d.like && x.user_id === me.id);
    const { error } = mineLike
      ? await sb.from('likes').delete().eq('review_id', d.like).eq('user_id', me.id)
      : await sb.from('likes').insert({ review_id: +d.like, user_id: me.id });
    if (error) alert(error.message); else load();
    return;
  }
  if (d.allComments) { openComments.add(+d.allComments); return render(); }
  if (d.editComment) {
    editingComment = +d.editComment;
    openComments.add(comments.find(x => x.id === editingComment)?.review_id); // 접혀 있던 댓글이어도 보이게
    render();
    const ta = document.getElementById(`ce${editingComment}`);
    ta?.focus(); ta?.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  if (d.cancelEdit) { editingComment = null; return render(); }
  if (d.delComment) {
    if (!confirm('이 댓글을 지울까요?')) return;
    const { error } = await sb.from('comments').delete().eq('id', d.delComment);
    if (error) alert(error.message); else load();
    return;
  }
  if (d.delReview) {
    if (!confirm('이 글을 지울까요?')) return;
    const r = reviews.find(x => x.id === +d.delReview);
    if (r?.photo_paths.length) await sb.storage.from('photos').remove(r.photo_paths);
    const { error } = await sb.from('reviews').delete().eq('id', d.delReview);
    if (error) alert(error.message); else load();
  }
  if (d.remove) {
    const m = who(d.remove);
    if (!confirm(`${m.role}(${m.email}) 계정을 탈퇴시키고 그 사람이 쓴 글과 사진을 지울까요?`)) return;
    const paths = reviews.filter(r => r.user_id === d.remove).flatMap(r => r.photo_paths);
    if (paths.length) await sb.storage.from('photos').remove(paths);
    const { error } = await sb.rpc('remove_member', { target: d.remove });
    if (error) alert(error.message); else load();
  }
});

boot().catch(() => { $('#root').innerHTML = '<p style="padding:40px 0">계획표를 불러오지 못했어요. 새로고침해 주세요.</p>'; });
</script>
</body>
</html>
