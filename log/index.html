<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제주 가족 기록</title>
<style>
:root{--paper:#f7f5ee;--ink:#263e36;--muted:#66736b;--line:#d8ded3;--accent:#286e79;--warn:#87562d;--soft:#ecefe5}
*{box-sizing:border-box}body{margin:0;background:#e6e9df;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}
.sheet{max-width:720px;margin:0 auto;min-height:100vh;padding:24px 16px 60px;background:var(--paper)}
h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:28px 0 10px;letter-spacing:-.4px}
.muted{color:var(--muted);font-size:13px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}.row>.fit{flex:none}
button{border:0;border-radius:7px;padding:10px 14px;background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:transparent;color:#a33;border:1px solid #e3c4c4;padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--soft);border-radius:20px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip b{font-weight:700}.tag{font-size:11px;background:#e9ede3;border-radius:4px;padding:1px 6px;color:#496350;margin-left:4px}.tag.off{background:#f4e8d6;color:var(--warn)}
.day{font-size:13px;font-weight:700;color:var(--accent);margin:18px 0 4px}
.visit h3{margin:0;font-size:16px}.visit .meta{font-size:12px;color:var(--muted)}
.review{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.review img{display:block;max-width:100%;border-radius:8px;margin-top:6px}
.stars{color:#d99b38;letter-spacing:1px}
.plan li{margin:3px 0;font-size:14px}.plan .done{color:var(--muted);text-decoration:line-through}
.plan button{padding:2px 8px;font-size:12px;margin-left:6px}
.err{color:#a33;font-size:13px;min-height:1em;margin:6px 0 0}
details summary{cursor:pointer;font-size:13px;color:var(--accent);margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="sheet">
<div class="top"><div><h1>제주 가족 기록</h1><p class="muted">다녀온 곳과 후기를 같이 남겨요 · <a href="../">원래 계획표 ↗</a></p></div>
<button id="logout" class="ghost" hidden>로그아웃</button></div>

<section id="auth" hidden>
<div class="panel">
<form id="authForm">
<label for="email">이메일</label><input id="email" type="email" autocomplete="email" required>
<label for="pw">비밀번호 (6자 이상)</label><input id="pw" type="password" minlength="6" autocomplete="current-password" required>
<div id="roleBox" hidden><label for="role">역할</label><select id="role"></select></div>
<p class="err" id="authErr"></p>
<div class="row"><button id="authBtn">로그인</button><button type="button" id="modeBtn" class="ghost">처음이에요 · 가입</button></div>
</form>
</div>
</section>

<section id="app" hidden>
<div class="chips" id="family"></div>

<h2>다녀온 곳 추가</h2>
<div class="panel">
<form id="addForm">
<label for="fromPlan">계획표에서 고르기</label><select id="fromPlan"><option value="">— 계획에 없던 곳이면 아래에 링크 —</option></select>
<label for="link">네이버 지도 링크</label>
<div class="row"><input id="link" type="url" placeholder="https://naver.me/..."><button type="button" id="resolveBtn" class="ghost fit">불러오기</button></div>
<label for="pname">장소 이름</label><input id="pname" required maxlength="100">
<label for="paddr">주소</label><input id="paddr">
<label for="pdate">날짜</label><input id="pdate" type="date" required>
<p class="err" id="addErr"></p>
<button>추가</button>
</form>
</div>

<h2>다녀온 곳</h2>
<div id="visits"><p class="muted">아직 기록이 없어요.</p></div>

<h2>계획표와 비교</h2>
<div class="panel plan" id="plan"><p class="muted">불러오는 중…</p></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://fyemdtozrsudffinpssp.supabase.co', 'sb_publishable_fzhxaI1Epe2wSmBcLGIbIA_jC5ykDXq');
const ADMIN = 'psh10066@gmail.com';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); // KST
let me, members = [], visits = [], reviews = [], photos = {}, plan = [], signup = false, channel = null;

// ---------- 로그인 / 가입 ----------
async function setMode(isSignup) {
  signup = isSignup;
  $('#authBtn').textContent = signup ? '가입' : '로그인';
  $('#modeBtn').textContent = signup ? '이미 가입했어요 · 로그인' : '처음이에요 · 가입';
  $('#roleBox').hidden = !signup;
  $('#authErr').textContent = '';
  if (!signup) return;
  const { data } = await sb.rpc('open_roles');
  $('#role').innerHTML = (data || []).map(r => `<option>${r}</option>`).join('');
  if (!data?.length) { $('#authErr').textContent = '가족 4명이 모두 가입했어요. 관리자에게 문의하세요.'; $('#authBtn').disabled = true; }
}
$('#modeBtn').onclick = () => { $('#authBtn').disabled = false; setMode(!signup); };
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  $('#authBtn').disabled = true;
  const email = $('#email').value.trim(), password = $('#pw').value;
  const { error } = signup
    ? await sb.auth.signUp({ email, password, options: { data: { role: $('#role').value } } })
    : await sb.auth.signInWithPassword({ email, password });
  $('#authBtn').disabled = false;
  $('#authErr').textContent = error ? (error.message.includes('Invalid login') ? '이메일이나 비밀번호가 맞지 않아요' : error.message) : '';
};
$('#logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_ev, session) => {
  const user = session?.user ?? null;
  if (me !== undefined && user?.id === me?.id) return; // 토큰 갱신 등 같은 사용자 이벤트는 무시
  me = user;
  $('#auth').hidden = !!me; $('#app').hidden = !me; $('#logout').hidden = !me;
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!me) return setMode(false);
  load();
  // shortcut: 변경이 오면 전체를 다시 읽음 (가족 4명 규모라 충분), 데이터가 커지면 행 단위 반영으로
  let t; const reload = () => { clearTimeout(t); t = setTimeout(load, 300); };
  channel = sb.channel('family')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'visits' }, reload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reviews' }, reload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, reload)
    .subscribe();
});

// ---------- 데이터 ----------
async function load() {
  const [m, v, r] = await Promise.all([
    sb.from('members').select('*').order('created_at'),
    sb.from('visits').select('*').order('visited_on', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('reviews').select('*').order('created_at'),
  ]);
  members = m.data || []; visits = v.data || []; reviews = r.data || [];
  if (me && !members.some(x => x.user_id === me.id)) {
    alert('가족 명단에 없는 계정이에요. 다시 로그인해 주세요.');
    return sb.auth.signOut();
  }
  const paths = reviews.map(x => x.photo_path).filter(p => p && !photos[p]);
  if (paths.length) {
    const { data } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
    (data || []).forEach(d => { if (d.signedUrl) photos[d.path] = d.signedUrl; });
  }
  render();
}

const who = id => members.find(x => x.user_id === id);
const whoLabel = id => { const m = who(id); return m ? `${m.role}` : '탈퇴한 가족'; };
const isAdmin = () => me?.email === ADMIN;

function render() {
  $('#family').innerHTML = members.map(m => `<span class="chip"><b>${esc(m.role)}</b>${esc(m.email)}${
    m.email === ADMIN ? '<span class="tag">관리자</span>' : ''}${
    isAdmin() && m.user_id !== me.id ? `<button class="danger" data-remove="${m.user_id}">탈퇴</button>` : ''}</span>`).join('');

  let lastDay = '';
  $('#visits').innerHTML = visits.length ? visits.map(v => {
    const day = v.visited_on !== lastDay ? `<div class="day">${esc(v.visited_on)}</div>` : '';
    lastDay = v.visited_on;
    const rs = reviews.filter(r => r.visit_id === v.id);
    const canDel = v.user_id === me.id || isAdmin();
    return `${day}<article class="panel visit">
      <div class="top"><div><h3>${v.place_url ? `<a href="${esc(v.place_url)}" target="_blank" rel="noopener">${esc(v.place_name)} ↗</a>` : esc(v.place_name)}
        ${v.plan_ref ? '<span class="tag">계획대로</span>' : '<span class="tag off">계획 밖</span>'}</h3>
        <div class="meta">${esc(v.address || '')}${v.address ? ' · ' : ''}${esc(whoLabel(v.user_id))}가 추가</div></div>
        ${canDel ? `<button class="danger" data-del-visit="${v.id}">삭제</button>` : ''}</div>
      ${rs.map(r => `<div class="review"><div class="top"><div><b>${esc(whoLabel(r.user_id))}</b>
          ${r.rating ? `<span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>` : ''}</div>
          ${r.user_id === me.id || isAdmin() ? `<button class="danger" data-del-review="${r.id}">삭제</button>` : ''}</div>
        ${r.body ? `<div>${esc(r.body).replace(/\n/g, '<br>')}</div>` : ''}
        ${r.photo_path && photos[r.photo_path] ? `<img src="${esc(photos[r.photo_path])}" alt="${esc(v.place_name)} 사진" loading="lazy">` : ''}</div>`).join('')}
      <details><summary>후기 남기기</summary><form class="reviewForm" data-visit="${v.id}">
        <label>별점<select name="rating"><option value="">선택 안 함</option>${[5,4,3,2,1].map(n => `<option value="${n}">${'★'.repeat(n)}</option>`).join('')}</select></label>
        <label>한 줄 평<textarea name="body" maxlength="2000"></textarea></label>
        <label>사진 (1장)<input name="photo" type="file" accept="image/*"></label>
        <p class="err"></p><button>저장</button></form></details>
    </article>`;
  }).join('') : '<p class="muted">아직 기록이 없어요.</p>';

  renderPlan();
}

// ---------- 계획표 (../index.html을 그대로 읽어 장소 목록을 만든다) ----------
async function loadPlan() {
  try {
    const doc = new DOMParser().parseFromString(await (await fetch('../index.html')).text(), 'text/html');
    doc.querySelectorAll('section.day').forEach(sec => {
      const day = sec.querySelector('.en')?.textContent.trim() + ' · ' + sec.querySelector('h2')?.textContent.trim();
      sec.querySelectorAll('.stop .detail a.place, .stop .choice a').forEach(a => {
        const name = a.textContent.replace(/[↗\s]+$/, '').replace(/\s+/g, ' ').trim();
        if (!plan.some(p => p.url === a.href)) plan.push({ day, name, url: a.href });
      });
    });
  } catch { plan = []; }
  const groups = [...new Set(plan.map(p => p.day))];
  $('#fromPlan').innerHTML += groups.map(g => `<optgroup label="${esc(g)}">${
    plan.filter(p => p.day === g).map(p => `<option value="${esc(p.url)}">${esc(p.name)}</option>`).join('')}</optgroup>`).join('');
  renderPlan();
}
function renderPlan() {
  if (!plan.length) return;
  const done = new Set(visits.map(v => v.plan_ref).filter(Boolean));
  const groups = [...new Set(plan.map(p => p.day))];
  $('#plan').innerHTML = `<p class="muted">계획 ${plan.length}곳 중 ${plan.filter(p => done.has(p.url)).length}곳 다녀옴</p>` + groups.map(g => `<div class="day">${esc(g)}</div><ul>${
    plan.filter(p => p.day === g).map(p => done.has(p.url)
      ? `<li class="done">${esc(p.name)}</li>`
      : `<li>${esc(p.name)}<button class="ghost" data-pick="${esc(p.url)}">다녀왔어요</button></li>`).join('')}</ul>`).join('');
}
function pickPlan(url) {
  const p = plan.find(x => x.url === url);
  $('#fromPlan').value = p ? url : '';
  if (!p) return;
  $('#link').value = p.url; $('#pname').value = p.name; $('#paddr').value = '';
  $('#addForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('#fromPlan').onchange = e => pickPlan(e.target.value);

// ---------- 추가 ----------
$('#resolveBtn').onclick = async () => {
  const url = $('#link').value.trim();
  if (!url) return;
  $('#resolveBtn').disabled = true; $('#addErr').textContent = '';
  const { data, error } = await sb.functions.invoke('resolve-place', { body: { url } });
  $('#resolveBtn').disabled = false;
  if (error) {
    let msg = '불러오지 못했어요. 이름을 직접 입력해 주세요.';
    try { msg = (await error.context.json()).error || msg; } catch {}
    $('#addErr').textContent = msg; return;
  }
  $('#link').value = data.url;
  if (data.name) $('#pname').value = data.name; else $('#addErr').textContent = '이름을 못 가져왔어요. 직접 입력해 주세요.';
  if (data.address) $('#paddr').value = data.address;
  // 계획표 링크가 짧은 링크여도 같은 장소면 '계획대로'로 묶는다
  const p = plan.find(x => x.url === data.url || x.name === data.name);
  if (p) $('#fromPlan').value = p.url;
};
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const url = $('#link').value.trim();
  if (url && !/^https:\/\//.test(url)) { $('#addErr').textContent = 'https:// 로 시작하는 링크만 넣을 수 있어요'; return; }
  const { error } = await sb.from('visits').insert({
    user_id: me.id, place_name: $('#pname').value.trim(), place_url: url || null,
    address: $('#paddr').value.trim() || null, plan_ref: $('#fromPlan').value || null, visited_on: $('#pdate').value,
  });
  $('#addErr').textContent = error ? error.message : '';
  if (!error) { e.target.reset(); $('#pdate').value = today(); load(); }
};

// ---------- 후기 · 삭제 · 탈퇴 ----------
async function shrink(file) { // 긴 변 1600px JPEG로 줄여서 무료 저장공간 아끼기
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}
document.addEventListener('submit', async e => {
  if (!e.target.matches('.reviewForm')) return;
  e.preventDefault();
  const f = e.target, err = f.querySelector('.err'), btn = f.querySelector('button');
  btn.disabled = true; err.textContent = '';
  try {
    let photo_path = null;
    const file = f.photo.files[0];
    if (file) {
      photo_path = `${me.id}/${crypto.randomUUID()}.jpg`;
      const { error } = await sb.storage.from('photos').upload(photo_path, await shrink(file), { contentType: 'image/jpeg' });
      if (error) throw error;
    }
    if (!f.rating.value && !f.body.value.trim() && !photo_path) throw new Error('별점, 글, 사진 중 하나는 남겨주세요');
    const { error } = await sb.from('reviews').insert({
      visit_id: +f.dataset.visit, user_id: me.id, rating: f.rating.value ? +f.rating.value : null,
      body: f.body.value.trim() || null, photo_path,
    });
    if (error) throw error;
    load();
  } catch (x) { err.textContent = x.message; btn.disabled = false; }
});
document.addEventListener('click', async e => {
  const d = e.target.dataset;
  if (d.pick) return pickPlan(d.pick);
  if (d.delVisit) {
    if (!confirm('이 장소와 달린 후기를 모두 지울까요?')) return;
    const paths = reviews.filter(r => r.visit_id === +d.delVisit && r.photo_path).map(r => r.photo_path);
    if (paths.length) await sb.storage.from('photos').remove(paths);
    const { error } = await sb.from('visits').delete().eq('id', d.delVisit);
    if (error) alert(error.message); else load();
  }
  if (d.delReview) {
    if (!confirm('이 후기를 지울까요?')) return;
    const r = reviews.find(x => x.id === +d.delReview);
    if (r?.photo_path) await sb.storage.from('photos').remove([r.photo_path]);
    const { error } = await sb.from('reviews').delete().eq('id', d.delReview);
    if (error) alert(error.message); else load();
  }
  if (d.remove) {
    const m = who(d.remove);
    if (!confirm(`${m.role}(${m.email})를 탈퇴시키고 그 사람이 쓴 후기와 사진을 지울까요?`)) return;
    const paths = reviews.filter(r => r.user_id === d.remove && r.photo_path).map(r => r.photo_path);
    if (paths.length) await sb.storage.from('photos').remove(paths);
    const { error } = await sb.rpc('remove_member', { target: d.remove });
    if (error) alert(error.message); else load();
  }
});

$('#pdate').value = today();
loadPlan();
</script>
</body>
</html>
