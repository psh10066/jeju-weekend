<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244c43">
<title>제주 가족 기록</title>
<!-- 계획표(../index.html)의 스타일과 본문을 그대로 가져와 그 위에 기록 기능을 얹는다 -->
<style id="planStyle"></style>
<style>
.famlog{display:grid;gap:12px;margin:0;padding:14px 0 0}
.famlog .sum{font-size:13px;font-weight:650}.famlog .sum span{color:var(--muted);font-weight:400}
.fam{display:flex;gap:16px;overflow-x:auto;padding:4px 2px}
.fam .p{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;font-size:11px;text-align:center}
.fam .p small{color:var(--muted);font-size:9px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{--ring:#d99b38;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:20px;line-height:1;background:var(--bg,#f3e6d3);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ring);flex:none}
.av.big{width:52px;height:52px;font-size:32px}.av.sm{width:22px;height:22px;font-size:13px;box-shadow:0 0 0 1.5px var(--ring)}
.av[data-r="아빠"]{--bg:#dfe9f2;--ring:#4c7fa8}.av[data-r="엄마"]{--bg:#f6e0e4;--ring:#c86b85}
.av[data-r="딸"]{--bg:#f7ead2;--ring:#d99b38}.av[data-r="아들"]{--bg:#dcefe2;--ring:#4f9a6b}
.lg-tabs{display:flex;background:#e6e9df;border-radius:9px;padding:3px;gap:3px}
.lg-tabs button{flex:1;border:0;background:none;border-radius:7px;padding:9px;font-size:13px;font-weight:650;color:var(--muted)}
.lg-tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px #0001}
.lg-login{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;max-width:420px}
.lg-login p{margin:0 0 8px;font-size:12px;color:var(--muted)}
.lg-field{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.lg-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
textarea.lg-input{min-height:96px;resize:vertical}
.lg-btns{display:flex;gap:8px;margin-top:14px}.lg-btns>*{flex:1}
.lg-b{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:7px;padding:10px 12px;font-size:13px;font-weight:650;min-height:42px}
.lg-b.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.lg-b.danger{background:transparent;color:#a33;border-color:#e3c4c4}
.lg-b:disabled{opacity:.5}
.lg-err{color:#a33;font-size:12px;min-height:1em;margin:6px 0 0}
.lg-x{border:0;background:none;color:#a88;font-size:11px;padding:2px 4px}
/* 계획표 탭: 장소 아래 기록 줄 */
.logrow{margin:6px 0 2px}
.lg-go{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--day);color:var(--day);background:transparent;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;margin-top:3px}
.lg-go.done{border-style:solid;background:var(--day);color:#fff}
.rv{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:#4f5c52;margin:6px 0 0;line-height:1.5}
.rv b{color:var(--ink);white-space:nowrap}.rv .st{color:#d99b38;letter-spacing:-1px;white-space:nowrap}
.rv .thumbs{display:flex;gap:3px;margin-top:3px}.rv .thumbs img{width:46px;height:46px;object-fit:cover;border-radius:5px;display:block}
.day.extra{--day:#a57a2c}.extra-empty{font-size:11px;color:var(--muted);margin:0 0 10px}
/* 피드 탭 */
#feed{max-width:520px;margin:18px auto 0}
.post{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:11px 12px}
.post-h .n{font-size:13px;font-weight:700;line-height:1.3}.post-h .t{font-size:11px;color:var(--muted);font-weight:400}
.post-h .lg-x{margin-left:auto}
.pl{display:inline-block;font-size:11px;color:var(--accent);font-weight:600;border:0;background:none;padding:0;text-align:left}
.post-imgs{position:relative}
.post-imgs .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.post-imgs .track::-webkit-scrollbar{display:none}
.post-imgs img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center;display:block;background:var(--soft)}
.post-imgs .cnt{position:absolute;top:10px;right:10px;background:#263e36b3;color:#fff;font-size:11px;border-radius:20px;padding:2px 8px}
.post-b{padding:10px 12px 13px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.post-b .st{color:#d99b38;letter-spacing:-1px;display:block;font-size:13px}
.post-b b{margin-right:6px}
.visit-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 0 14px;padding:0 4px}
.feed-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}
.fab{position:fixed;right:max(16px,calc(50% - 680px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 20px #263e3655;z-index:6}
body.feed .overview,body.feed .mobile-nav,body.feed .days,body.feed .checkbar,body.feed .footer{display:none}
body:not(.feed) #feed{display:none}
/* 작성 시트 */
dialog#sheet{border:0;border-radius:14px;padding:18px;width:min(480px,calc(100% - 32px));max-height:88vh;background:var(--paper);color:var(--ink);box-shadow:0 10px 50px #0004}
dialog#sheet::backdrop{background:#263e3666}
dialog h3{margin:0;font-size:18px;letter-spacing:-.5px}dialog .meta{font-size:12px;color:var(--muted);margin:2px 0 0}
.stars{display:flex;gap:2px}.stars input{position:absolute;opacity:0;pointer-events:none}
.stars label{font-size:28px;color:#d6d0c0;cursor:pointer;line-height:1;padding:2px}
.stars label.on{color:#d99b38}.stars input:focus-visible+label{outline:2px solid #d99b38}
.previews{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.previews img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none}
.mobile-nav a.lg-nav{color:#a57a2c}
[hidden]{display:none!important}
@media(max-width:700px){
  dialog#sheet{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh}
  .lg-go{font-size:12px;padding:7px 12px;min-height:34px}
  .rv{font-size:13px}.rv .thumbs img{width:56px;height:56px}
  .famlog .sum{font-size:14px}.fam .p{font-size:12px}.fam .p small{font-size:10px}
  .mobile-nav{gap:6px}.mobile-nav a{font-size:11px;padding:10px 2px}
  #feed{margin:16px -20px 0}.post{border-radius:0;border-left:0;border-right:0}.visit-line{padding:0 16px}
}
@media print{.famlog,.logrow,.lg-go,dialog,.fab,#feed{display:none!important}}
</style>
</head>
<body>
<main class="sheet" id="root"><p style="padding:40px 0;color:#66736b">계획표 불러오는 중…</p></main>
<button type="button" class="fab" id="fab" aria-label="새 글 쓰기" hidden>＋</button>

<dialog id="sheet">
<form id="sheetForm" method="dialog">
<h3 id="sTitle"></h3><p class="meta" id="sMeta"></p>
<div id="sPlaceBox">
<label class="lg-field" for="sPlace">장소 (선택)</label>
<select class="lg-input" id="sPlace"></select>
</div>
<div id="sNew" hidden>
<label class="lg-field" for="sLink">네이버 지도 링크</label>
<div style="display:flex;gap:6px"><input class="lg-input" id="sLink" type="url" inputmode="url" placeholder="https://naver.me/..."><button type="button" class="lg-b ghost" id="sResolve" style="flex:none">불러오기</button></div>
<label class="lg-field" for="sName">장소 이름</label><input class="lg-input" id="sName" maxlength="100">
<label class="lg-field" for="sAddr">주소</label><input class="lg-input" id="sAddr">
</div>
<div id="sStarBox"><span class="lg-field">별점 (선택)</span><div class="stars" id="sStars"></div></div>
<label class="lg-field" for="sBody">글</label><textarea class="lg-input" id="sBody" maxlength="2000" placeholder="오늘 어땠어요?"></textarea>
<div id="sPhotoBox"><label class="lg-field" for="sPhoto">사진 (여러 장, 최대 10장)</label><input class="lg-input" id="sPhoto" type="file" accept="image/*" multiple>
<div class="previews" id="sPreviews"></div></div>
<p class="lg-err" id="sErr"></p>
<div class="lg-btns"><button type="button" class="lg-b ghost" id="sClose">닫기</button><button class="lg-b" id="sSave">올리기</button></div>
<div class="lg-btns" id="sDelBox" hidden><button type="button" class="lg-b danger" id="sDel">이 방문 기록 지우기</button></div>
</form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://fyemdtozrsudffinpssp.supabase.co', 'sb_publishable_fzhxaI1Epe2wSmBcLGIbIA_jC5ykDXq');
const ADMIN = 'psh10066@gmail.com';
const FACE = { 아빠: '👨', 엄마: '👩', 딸: '👧', 아들: '👦' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '';
const when = ts => new Date(ts).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })
  .replace(/^(\d+)\. (\d+)\. /, '$1/$2 '); // 10. 30. 오후 8:05 → 10/30 오후 8:05
const av = (role, cls = '') => `<span class="av ${cls}" data-r="${esc(role)}" aria-hidden="true">${FACE[role] ?? '🙂'}</span>`;
let me, members = [], visits = [], reviews = [], photos = {}, plan = [], signup = false, channel = null, cur = null;
let tab = 'feed';
try { tab = localStorage.getItem('jeju-log-tab') || 'feed'; } catch {}

$('#sStars').innerHTML = [1, 2, 3, 4, 5].map(n => `<input type="radio" name="star" id="st${n}" value="${n}"><label for="st${n}" aria-label="${n}점">★</label>`).join('');
$('#sStars').onchange = paintStars;
function paintStars() {
  const v = +($('#sStars input:checked')?.value || 0);
  $('#sStars').querySelectorAll('label').forEach((l, i) => l.classList.toggle('on', i < v));
}

// ---------- 계획표 가져와서 꾸미기 ----------
async function boot() {
  const doc = new DOMParser().parseFromString(await (await fetch('../index.html', { cache: 'no-cache' })).text(), 'text/html');
  $('#planStyle').textContent = [...doc.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const main = document.importNode(doc.querySelector('main.sheet'), true);
  $('#root').replaceWith(main);

  main.querySelector('.eyebrow').textContent = 'JEJU ISLAND · FAMILY LOG';
  main.querySelector('.subtitle').innerHTML = '다녀온 곳과 그날 이야기를 가족끼리 같이 남겨요 · <a href="../" style="text-decoration:underline;white-space:nowrap">원래 계획표</a>';
  main.querySelector('.actions').innerHTML = '<button class="pill" type="button" id="logout" hidden>로그아웃</button>';
  main.querySelector('.mast').insertAdjacentHTML('afterend', `<section class="famlog" aria-label="가족 기록">
    <div class="sum" id="sum"></div><div class="fam" id="fam"></div>
    <div class="lg-tabs" id="tabs" role="group" aria-label="보기" hidden><button type="button" data-tab="feed">피드</button><button type="button" data-tab="plan">계획표</button></div>
    <div class="lg-login" id="auth" hidden><form id="authForm">
      <p>가족만 기록할 수 있어요. 처음이면 ‘가입’을 눌러주세요.</p>
      <label class="lg-field" for="email">이메일</label><input class="lg-input" id="email" type="email" autocomplete="email" required>
      <label class="lg-field" for="pw">비밀번호 (6자 이상)</label><input class="lg-input" id="pw" type="password" minlength="6" autocomplete="current-password" required>
      <div id="roleBox" hidden><label class="lg-field" for="role">역할</label><select class="lg-input" id="role"></select></div>
      <p class="lg-err" id="authErr"></p>
      <div class="lg-btns"><button class="lg-b" id="authBtn">로그인</button><button type="button" class="lg-b ghost" id="modeBtn">처음이에요 · 가입</button></div>
    </form></div></section>
    <section id="feed" aria-label="가족 피드"></section>`);
  main.querySelector('.mobile-nav').insertAdjacentHTML('beforeend', '<a href="#extra" class="lg-nav">+ 계획 밖</a>');

  // 계획 장소마다 기록 줄(.logrow)을 그 장소 설명 끝에 단다. 한 칸에 장소가 여럿이면 이름을 붙여 한 줄씩
  main.querySelectorAll('section.day').forEach(sec => {
    const day = sec.querySelector('.en')?.textContent.trim() + ' · ' + sec.querySelector('h2')?.textContent.trim();
    const addRows = (links, put) => links.forEach(a => {
      const name = a.textContent.replace(/[↗\s]+$/, '').replace(/\s+/g, ' ').trim();
      if (!plan.some(p => p.url === a.href)) plan.push({ day, name, url: a.href });
      put(`<div class="logrow" data-plan="${esc(a.href)}" data-name="${esc(name)}" data-labeled="${links.length > 1 ? 1 : ''}"></div>`);
    });
    sec.querySelectorAll('.stop .detail').forEach(d => {
      const opt = d.querySelector('.option');
      const own = [...d.querySelectorAll(':scope > h3 a.place, :scope > .choice a')];
      addRows(own, html => opt ? opt.insertAdjacentHTML('beforebegin', html) : d.insertAdjacentHTML('beforeend', html));
      d.querySelectorAll('.option').forEach(o => addRows([...o.querySelectorAll(':scope > h3 a.place')], html => o.insertAdjacentHTML('beforeend', html)));
    });
  });

  main.querySelector('.days').insertAdjacentHTML('beforeend', `<section class="day extra" id="extra"><header class="day-head"><span class="day-no">+</span><div><h2>계획 밖에서 다녀온 곳</h2><p>네이버 지도 링크로 어디든 추가</p></div><span class="en">EXTRA</span></header>
    <div class="timeline" id="extraList"></div><button type="button" class="lg-go" data-new-place="1">+ 다른 곳 추가</button></section>`);
  main.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  main.querySelectorAll('[data-check]').forEach(input => { // 계획표의 체크리스트 저장 그대로
    const key = 'jeju-trip-' + input.dataset.check;
    try { input.checked = localStorage.getItem(key) === 'yes'; } catch {}
    input.addEventListener('change', () => { try { localStorage.setItem(key, input.checked ? 'yes' : 'no'); } catch {} });
  });

  const groups = [...new Set(plan.map(p => p.day))];
  $('#sPlace').innerHTML = '<option value="">장소 없이 쓰기</option><option value="new">+ 계획 밖 장소 (네이버 링크)</option>' +
    groups.map(g => `<optgroup label="${esc(g)}">${plan.filter(p => p.day === g).map(p => `<option value="${esc(p.url)}">${esc(p.name)}</option>`).join('')}</optgroup>`).join('');

  $('#modeBtn').onclick = () => { $('#authBtn').disabled = false; setMode(!signup); };
  $('#authForm').onsubmit = onAuth;
  $('#logout').onclick = () => sb.auth.signOut();
  $('#tabs').onclick = e => { if (e.target.dataset.tab) setTab(e.target.dataset.tab); };
  sb.auth.onAuthStateChange(onSession);
}

function setTab(t) {
  tab = t;
  try { localStorage.setItem('jeju-log-tab', t); } catch {}
  document.body.classList.toggle('feed', !!me && t === 'feed');
  $('#tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === t));
}

// ---------- 로그인 / 가입 ----------
async function setMode(isSignup) {
  signup = isSignup;
  $('#authBtn').textContent = signup ? '가입' : '로그인';
  $('#modeBtn').textContent = signup ? '이미 가입했어요' : '처음이에요 · 가입';
  $('#roleBox').hidden = !signup;
  $('#authErr').textContent = '';
  if (!signup) return;
  const { data } = await sb.rpc('open_roles');
  $('#role').innerHTML = (data || []).map(r => `<option>${r}</option>`).join('');
  if (!data?.length) { $('#authErr').textContent = '가족 4명이 모두 가입했어요. 관리자에게 문의하세요.'; $('#authBtn').disabled = true; }
}
async function onAuth(e) {
  e.preventDefault();
  $('#authBtn').disabled = true;
  const email = $('#email').value.trim(), password = $('#pw').value;
  const { error } = signup
    ? await sb.auth.signUp({ email, password, options: { data: { role: $('#role').value } } })
    : await sb.auth.signInWithPassword({ email, password });
  $('#authBtn').disabled = false;
  $('#authErr').textContent = error ? (error.message.includes('Invalid login') ? '이메일이나 비밀번호가 맞지 않아요' : error.message) : '';
}
function onSession(_ev, session) {
  const user = session?.user ?? null;
  if (me !== undefined && user?.id === me?.id) return; // 토큰 갱신 등 같은 사용자 이벤트는 무시
  me = user;
  $('#auth').hidden = !!me; $('#logout').hidden = !me; $('#tabs').hidden = !me; $('#fab').hidden = !me;
  setTab(tab);
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!me) { members = visits = reviews = []; render(); return setMode(false); }
  load();
  // shortcut: 변경이 오면 전체를 다시 읽음 (가족 4명 규모라 충분), 데이터가 커지면 행 단위 반영으로
  let t; const reload = () => { clearTimeout(t); t = setTimeout(load, 300); };
  channel = sb.channel('family');
  ['visits', 'reviews', 'members'].forEach(table => channel.on('postgres_changes', { event: '*', schema: 'public', table }, reload));
  channel.subscribe();
}

// ---------- 데이터 ----------
async function load() {
  const [m, v, r] = await Promise.all([
    sb.from('members').select('*').order('created_at'),
    sb.from('visits').select('*').order('visited_on').order('created_at'),
    sb.from('reviews').select('*').order('created_at', { ascending: false }),
  ]);
  members = m.data || []; visits = v.data || []; reviews = r.data || [];
  if (me && !members.some(x => x.user_id === me.id)) {
    alert('가족 명단에 없는 계정이에요. 다시 로그인해 주세요.');
    return sb.auth.signOut();
  }
  const paths = reviews.flatMap(x => x.photo_paths).filter(p => !photos[p]);
  if (paths.length) {
    const { data } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
    (data || []).forEach(d => { if (d.signedUrl) photos[d.path] = d.signedUrl; });
  }
  render();
}

const who = id => members.find(x => x.user_id === id);
const roleOf = id => who(id)?.role ?? '탈퇴한 가족';
const isAdmin = () => me?.email === ADMIN;
const mine = row => row.user_id === me?.id || isAdmin();
const stars = n => n ? `<span class="st">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : '';

function reviewsHtml(visit) { // 계획표 탭: 장소 아래 짧게
  return reviews.filter(r => r.visit_id === visit.id).reverse().map(r => `<div class="rv">${av(roleOf(r.user_id), 'sm')}
    <div><b>${esc(roleOf(r.user_id))}</b> ${stars(r.rating)}${r.user_id === me?.id ? ` <button class="lg-x" data-edit-review="${r.id}">수정</button>` : ''}${mine(r) ? `<button class="lg-x" data-del-review="${r.id}">지우기</button>` : ''}${r.body ? `<br>${esc(r.body).replace(/\n/g, '<br>')}` : ''}
    ${r.photo_paths.length ? `<div class="thumbs">${r.photo_paths.slice(0, 4).map(p => photos[p] ? `<img src="${esc(photos[p])}" alt="" loading="lazy">` : '').join('')}</div>` : ''}</div></div>`).join('');
}

function postHtml(r) { // 피드 탭: 인스타 카드
  const v = r.visit_id ? visits.find(x => x.id === r.visit_id) : null;
  const imgs = r.photo_paths.filter(p => photos[p]);
  return `<article class="post">
    <div class="post-h">${av(roleOf(r.user_id))}<div><div class="n">${esc(roleOf(r.user_id))} <span class="t">· ${when(r.created_at)}</span></div>
      ${v ? `<button type="button" class="pl" data-goto="${v.id}">📍 ${esc(v.place_name)}</button>` : ''}</div>
      <span style="margin-left:auto">${r.user_id === me?.id ? `<button class="lg-x" data-edit-review="${r.id}">수정</button>` : ''}${mine(r) ? `<button class="lg-x" data-del-review="${r.id}">지우기</button>` : ''}</span></div>
    ${imgs.length ? `<div class="post-imgs"><div class="track">${imgs.map((p, i) => `<img src="${esc(photos[p])}" alt="${esc(roleOf(r.user_id))}의 사진 ${i + 1}" loading="lazy">`).join('')}</div>${imgs.length > 1 ? `<span class="cnt">${imgs.length}장</span>` : ''}</div>` : ''}
    ${r.rating || r.body ? `<div class="post-b">${stars(r.rating)}${r.body ? `<b>${esc(roleOf(r.user_id))}</b>${esc(r.body)}` : ''}</div>` : ''}
  </article>`;
}

function render() {
  const planDone = plan.filter(p => visits.some(v => v.plan_ref === p.url)).length;
  const extra = visits.filter(v => !v.plan_ref);
  $('#sum').innerHTML = me
    ? `계획 ${plan.length}곳 중 ${planDone}곳 다녀옴 <span>· 계획 밖 ${extra.length}곳 · 글 ${reviews.length}개</span>`
    : '<span>로그인하면 가족이 남긴 기록이 이 계획표 위에 함께 보여요.</span>';
  $('#fam').innerHTML = members.map(m => `<div class="p">${av(m.role, 'big')}<b>${esc(m.role)}${m.user_id === me?.id ? ' (나)' : ''}</b><small>${esc(m.email)}</small>${
    m.email === ADMIN ? '<small>관리자</small>' : ''}${isAdmin() && m.user_id !== me.id ? `<button class="lg-x" data-remove="${m.user_id}">탈퇴시키기</button>` : ''}</div>`).join('');

  document.querySelectorAll('.logrow').forEach(row => {
    if (!me) { row.innerHTML = ''; return; }
    const v = visits.find(x => x.plan_ref === row.dataset.plan);
    const label = row.dataset.labeled ? `${esc(row.dataset.name)} ` : '';
    row.innerHTML = v
      ? `<button type="button" class="lg-go done" data-open="${esc(row.dataset.plan)}">✓ ${label}${md(v.visited_on)} 다녀옴 · 글 쓰기</button>${reviewsHtml(v)}`
      : `<button type="button" class="lg-go" data-open="${esc(row.dataset.plan)}">${label}다녀왔어요</button>`;
  });

  $('#extra').hidden = !me;
  $('#extraList').innerHTML = extra.length ? extra.map(v => `<article class="stop" data-visit-row="${v.id}"><div class="time">${md(v.visited_on)}<small>${esc(roleOf(v.user_id))}</small></div><div class="detail">
    <h3>${v.place_url ? `<a class="place" href="${esc(v.place_url)}" target="_blank" rel="noopener noreferrer">${esc(v.place_name)}</a>` : esc(v.place_name)}</h3>
    ${v.address ? `<p class="address">${esc(v.address)}</p>` : ''}
    <button type="button" class="lg-go done" data-open-visit="${v.id}">글 쓰기</button>${reviewsHtml(v)}</div></article>`).join('')
    : '<p class="extra-empty">계획에 없던 곳을 갔다면 네이버 지도에서 공유 링크를 복사해 추가하세요.</p>';

  // 피드: 글 + (글 없이) 다녀왔어요만 누른 기록을 시간순으로
  const items = [
    ...reviews.map(r => ({ at: r.created_at, html: postHtml(r) })),
    ...visits.filter(v => !reviews.some(r => r.visit_id === v.id)).map(v => ({ at: v.created_at,
      html: `<p class="visit-line">${av(roleOf(v.user_id), 'sm')}<span><b>${esc(roleOf(v.user_id))}</b>가 <button type="button" class="pl" data-goto="${v.id}">📍 ${esc(v.place_name)}</button>에 다녀왔어요 · ${when(v.created_at)}</span></p>` })),
  ].sort((a, b) => b.at.localeCompare(a.at));
  $('#feed').innerHTML = items.length ? items.map(x => x.html).join('') : '<p class="feed-empty">아직 올라온 글이 없어요.<br>오른쪽 아래 ＋ 버튼으로 첫 글을 올려보세요.</p>';
}

// ---------- 작성 시트 ----------
// cur = { planUrl, visit, name } · 피드의 ＋는 장소를 고를 수 있고, 장소에서 열면 그 장소로 고정
function openSheet({ planUrl = null, visitId = null, newPlace = false, editId = null } = {}) {
  if (editId) return openEdit(reviews.find(r => r.id === +editId));
  $('#sPhotoBox').hidden = false;
  const visit = visitId ? visits.find(v => v.id === +visitId) : planUrl ? visits.find(v => v.plan_ref === planUrl) : null;
  const fixed = !!(planUrl || visit);
  cur = { planUrl, visit, name: visit?.place_name ?? plan.find(x => x.url === planUrl)?.name };
  $('#sheetForm').reset(); paintStars(); $('#sPreviews').innerHTML = '';
  $('#sTitle').textContent = fixed ? cur.name : newPlace ? '계획 밖 장소 추가' : '새 글';
  $('#sMeta').textContent = visit ? `${md(visit.visited_on)} 다녀옴 · ${roleOf(visit.user_id)}가 처음 기록` : fixed ? '글 없이 올려도 ‘다녀옴’으로 표시돼요' : '';
  $('#sPlaceBox').hidden = fixed;
  $('#sPlace').value = newPlace ? 'new' : '';
  $('#sNew').hidden = !newPlace;
  $('#sStarBox').hidden = !(fixed || newPlace);
  $('#sDelBox').hidden = !(visit && mine(visit));
  $('#sSave').textContent = fixed && !visit ? '다녀왔어요 · 올리기' : '올리기';
  $('#sErr').textContent = ''; $('#sSave').disabled = false;
  $('#sheet').showModal();
}
function openEdit(r) { // 본인 글 수정: 글·별점만 (사진은 지우고 다시 올리기)
  const v = r.visit_id ? visits.find(x => x.id === r.visit_id) : null;
  cur = { edit: r };
  $('#sheetForm').reset(); $('#sPreviews').innerHTML = '';
  $('#sTitle').textContent = '글 수정';
  $('#sMeta').textContent = v ? `📍 ${v.place_name}` : '';
  $('#sPlaceBox').hidden = $('#sNew').hidden = $('#sPhotoBox').hidden = $('#sDelBox').hidden = true;
  $('#sStarBox').hidden = !v;
  if (r.rating) $(`#st${r.rating}`).checked = true;
  paintStars();
  $('#sBody').value = r.body ?? '';
  $('#sSave').textContent = '수정 완료'; $('#sErr').textContent = ''; $('#sSave').disabled = false;
  $('#sheet').showModal();
}
$('#sPlace').onchange = e => {
  const v = e.target.value;
  cur.planUrl = v && v !== 'new' ? v : null;
  cur.name = plan.find(x => x.url === cur.planUrl)?.name;
  cur.visit = cur.planUrl ? visits.find(x => x.plan_ref === cur.planUrl) : null;
  $('#sNew').hidden = v !== 'new';
  $('#sStarBox').hidden = !v;
};
$('#sPhoto').onchange = e => {
  const files = [...e.target.files];
  $('#sErr').textContent = files.length > 10 ? '사진은 10장까지 올릴 수 있어요. 앞의 10장만 올라가요.' : '';
  $('#sPreviews').innerHTML = files.slice(0, 10).map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join('');
};
$('#sClose').onclick = () => $('#sheet').close();
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.target.close(); }); // 바깥 누르면 닫기

$('#sResolve').onclick = async () => {
  const url = $('#sLink').value.trim();
  if (!url) return;
  $('#sResolve').disabled = true; $('#sErr').textContent = '';
  const { data, error } = await sb.functions.invoke('resolve-place', { body: { url } });
  $('#sResolve').disabled = false;
  if (error) {
    let msg = '불러오지 못했어요. 이름을 직접 입력해 주세요.';
    try { msg = (await error.context.json()).error || msg; } catch {}
    $('#sErr').textContent = msg; return;
  }
  $('#sLink').value = data.url;
  if (data.name) $('#sName').value = data.name; else $('#sErr').textContent = '이름을 못 가져왔어요. 직접 입력해 주세요.';
  if (data.address) $('#sAddr').value = data.address;
  const p = plan.find(x => x.url === data.url || x.name === data.name); // 계획에 있던 곳이면 그 장소로 묶기
  if (p) { $('#sPlace').value = p.url; $('#sPlace').dispatchEvent(new Event('change')); $('#sMeta').textContent = '계획표에 있는 곳이라 그 장소로 올려요'; }
};

async function shrink(file) { // 긴 변 1600px JPEG로 줄여서 무료 저장공간 아끼기
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}

async function ensureVisit() { // 장소가 정해졌으면 방문 기록(가족 공용 1건)을 찾거나 만든다
  if (cur.visit) return cur.visit;
  const newPlace = !$('#sNew').hidden;
  if (!cur.planUrl && !newPlace) return null;
  const row = cur.planUrl
    ? { place_name: cur.name, place_url: cur.planUrl, plan_ref: cur.planUrl }
    : { place_name: $('#sName').value.trim(), place_url: $('#sLink').value.trim() || null, address: $('#sAddr').value.trim() || null };
  if (!row.place_name) throw new Error('장소 이름을 넣어주세요');
  if (row.place_url && !/^https:\/\//.test(row.place_url)) throw new Error('https:// 로 시작하는 링크만 넣을 수 있어요');
  const ins = await sb.from('visits').insert({ ...row, user_id: me.id }).select().single();
  if (ins.error?.code === '23505') return (await sb.from('visits').select().eq('plan_ref', cur.planUrl).single()).data; // 다른 가족이 방금 먼저 기록함
  if (ins.error) throw ins.error;
  return ins.data;
}

$('#sheetForm').onsubmit = async e => {
  e.preventDefault();
  $('#sSave').disabled = true; $('#sErr').textContent = '';
  try {
    const body = $('#sBody').value.trim() || null, files = [...$('#sPhoto').files].slice(0, 10);
    const rating = $('#sStarBox').hidden ? null : +($('#sStars input:checked')?.value || 0) || null;
    if (cur.edit) {
      if (!body && !rating && !cur.edit.photo_paths.length) throw new Error('글을 비우려면 ‘지우기’를 눌러주세요');
      const { error } = await sb.from('reviews').update({ body, rating }).eq('id', cur.edit.id);
      if (error) throw error;
      $('#sheet').close(); return load();
    }
    const hasPost = body || rating || files.length;
    if (!hasPost && (cur.visit || $('#sPlace').value === '' && !cur.planUrl)) throw new Error('글이나 사진을 넣어주세요');
    const visit = await ensureVisit();
    if (hasPost) {
      const photo_paths = files.map(() => `${me.id}/${crypto.randomUUID()}.jpg`);
      await Promise.all(files.map(async (f, i) => {
        const up = await sb.storage.from('photos').upload(photo_paths[i], await shrink(f), { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
      }));
      const { error } = await sb.from('reviews').insert({ visit_id: visit?.id ?? null, user_id: me.id, rating, body, photo_paths });
      if (error) { await sb.storage.from('photos').remove(photo_paths); throw error; }
    }
    $('#sheet').close();
    load();
  } catch (x) { $('#sErr').textContent = x.message; $('#sSave').disabled = false; }
};

$('#sDel').onclick = async () => {
  const v = cur.visit;
  if (!v || !confirm('이 방문 기록과 달린 글을 모두 지울까요?')) return;
  const paths = reviews.filter(r => r.visit_id === v.id).flatMap(r => r.photo_paths);
  if (paths.length) await sb.storage.from('photos').remove(paths);
  const { error } = await sb.from('visits').delete().eq('id', v.id);
  if (error) return alert(error.message);
  $('#sheet').close(); load();
};

function gotoVisit(id) { // 피드의 📍 → 계획표 탭에서 그 장소로
  const v = visits.find(x => x.id === +id);
  if (!v) return;
  setTab('plan');
  const el = v.plan_ref ? [...document.querySelectorAll('.logrow')].find(r => r.dataset.plan === v.plan_ref) : document.querySelector(`[data-visit-row="${v.id}"]`);
  el?.closest('.stop')?.scrollIntoView({ block: 'center' });
}

$('#fab').onclick = () => openSheet();
document.addEventListener('click', async e => {
  const d = e.target.closest('button')?.dataset;
  if (!d) return;
  if (d.open) return openSheet({ planUrl: d.open });
  if (d.openVisit) return openSheet({ visitId: d.openVisit });
  if (d.newPlace) return openSheet({ newPlace: true });
  if (d.goto) return gotoVisit(d.goto);
  if (d.editReview) return openSheet({ editId: d.editReview });
  if (d.delReview) {
    if (!confirm('이 글을 지울까요?')) return;
    const r = reviews.find(x => x.id === +d.delReview);
    if (r?.photo_paths.length) await sb.storage.from('photos').remove(r.photo_paths);
    const { error } = await sb.from('reviews').delete().eq('id', d.delReview);
    if (error) alert(error.message); else load();
  }
  if (d.remove) {
    const m = who(d.remove);
    if (!confirm(`${m.role}(${m.email})를 탈퇴시키고 그 사람이 쓴 글과 사진을 지울까요?`)) return;
    const paths = reviews.filter(r => r.user_id === d.remove).flatMap(r => r.photo_paths);
    if (paths.length) await sb.storage.from('photos').remove(paths);
    const { error } = await sb.rpc('remove_member', { target: d.remove });
    if (error) alert(error.message); else load();
  }
});

boot().catch(() => { $('#root').innerHTML = '<p style="padding:40px 0">계획표를 불러오지 못했어요. 새로고침해 주세요.</p>'; });
</script>
</body>
</html>
